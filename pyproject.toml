[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleekcurated"
version = "0.1.0"
description = "Fleek clothing upsell — classify prompts and AI customisation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
include = ["part1_classifier*", "part2_customizer*"]

[tool.setuptools.package-data]
part1_classifier = ["data/*.json", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
